name: API PR84 signed app-only transfer
on:
  push:
    branches: [agent/api-pr84-signed-history-ci-repair-20261125]

permissions:
  contents: read
jobs:
  listener:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source and no SQL011
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -f infra/postgres/migrations/011_product_answer_claims.up.sql
      - name: Install exact API lock
        run: python -m pip install --require-hashes --only-binary=:all: -r locks/requirements-api.lock
      - name: Compile and check original plus transferred listener boundaries
        run: |
          python -m compileall -q apps/api/private_app_only_asgi.py
          python -m unittest discover -s tests/phase3/integration/api -p test_loopback_pg_relay.py -v
          python -m unittest discover -s tests/phase3/api -p test_app_only_route_policy.py -v
          python -m unittest discover -s tests/phase3/api -p test_app_only_pg_policy.py -v
          python -m unittest discover -s tests/phase3/api -p test_app_only_asgi.py -v
          python -m unittest discover -s tests/phase3/api -p test_app_only_no_engine.py -v
          python -m unittest discover -s tests/phase3/integration/api -p test_app_only_mtls_network.py -v
      - name: Scope of this check
        run: echo 'Real TLS transport with mocked PG authority; NOT integrated PG History or full product readiness'
