name: Foundation F3 claim citation DOM and debug boundary (fixture only)
on:
  push:
    branches: [integration/f3-foundation-send-fence-restore-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  citation-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --prefix apps/web --no-audit --no-fund && npm --prefix apps/web run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: |
          python -m pip install --no-cache-dir 'playwright==1.64.1'
          python -m playwright install --with-deps chromium
      - name: Actual React DOM on isolated loopback with labelled fixtures
        env:
          PHASE3_APP_MODE: APP_ONLY
        run: |
          set -euo pipefail
          (cd apps/web && exec ./node_modules/.bin/next start -H 127.0.0.1 -p 3000) > "$RUNNER_TEMP/f3-citation-next.log" 2>&1 &
          child=$!
          trap 'kill "$child" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/product-capabilities >/dev/null; then break; fi
            sleep 1
          done
          python tests/phase3/integration/foundation/f3_citation_fixture_browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: f3-citation-dom-fixture
          path: ci_receipts/f3_citation_dom_fixture.json
          if-no-files-found: error
          retention-days: 14
