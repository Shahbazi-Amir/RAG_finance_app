name: API_F3 Gate3 isolated retrieved-source evidence (offline only)

on:
  push:
    branches: [agent/api-f3-gate3-retrieval-isolated-20261122]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c018-evidence-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned API test dependencies, no model or Gateway
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes --only-binary=:all: -r locks/requirements-api.lock
          python -m pip check
      - name: Compile exact API source
        run: |
          python -m compileall -q src/phase3/rag_runtime apps/api tests/phase3/api
      - name: "Full API unit suite: Login/Session, startup, T1/T2, evidence/GET, error and replay"
        run: |
          python -m unittest discover -s tests/phase3/api -p 'test_*.py' -v
      - name: Product contracts and History semantics
        run: |
          python -m unittest discover -s tests/phase3/contracts -p 'test_*.py' -v

  web-proxy-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact UI lockfile
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Typecheck BFF and proxy changes
        working-directory: apps/web
        run: npm run typecheck
      - name: Existing signed BFF and proxy tests
        working-directory: apps/web
        run: npm test
