name: API_F3 Gate3 isolated retrieved-source evidence (offline only)

on:
  push:
    branches: [agent/api-f3-gate3-retrieval-isolated-20261122]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c018-evidence-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned API test dependencies, no model or Gateway
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes --only-binary=:all: -r locks/requirements-api.lock
          python -m pip check
      - name: Compile exact API source
        run: |
          python -m compileall -q src/phase3/rag_runtime apps/api tests/phase3/api
      - name: HTTP route 401/404/503 and GET-only refresh (fixture identity)
        run: |
          python -m unittest discover -s tests/phase3/api -p 'test_retrieved_sources_http_contract.py' -v
      - name: API Login/Session + Service proof + preflight regressions
        run: |
          python -m unittest discover -s tests/phase3/api -p 'test_service_proof.py' -v
          python -m unittest discover -s tests/phase3/api -p 'test_staging_service_profile.py' -v
          python -m unittest discover -s tests/phase3/api -p 'test_staging_private_asgi.py' -v
      - name: C018 fixture identities, durable ledger, no replay
        run: |
          python -m unittest discover -s tests/phase3/api -p 'test_retrieved_sources_gate3.py' -v
      - name: Baseline no-dispatch regression (local synthetic child only)
        run: |
          python -m unittest discover -s tests/phase3/api -p 'test_staging_no_dispatch.py' -v
      - name: Linux pidfd/proc spawn audit regression (synthetic child only)
        run: |
          python -m unittest discover -s tests/phase3/api -p 'test_staging_c018_spawn_audit.py' -v

  web-proxy-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact UI lockfile
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Typecheck BFF and proxy changes
        working-directory: apps/web
        run: npm run typecheck
      - name: Existing signed BFF and proxy tests
        working-directory: apps/web
        run: npm test
