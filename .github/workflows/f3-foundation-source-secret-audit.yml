name: FOUNDATION F3 source secret scan (redacted, CI-only, no release authority)
on:
  push:
    branches: [integration/f3-foundation-history-two-users-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checked-out-source-secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache: false
      - name: Build exact pinned Gitleaks source scanner
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          test -x "$(go env GOPATH)/bin/gitleaks"
          "$(go env GOPATH)/bin/gitleaks" version
      - name: Validate secret redaction and triage logic against synthetic dangerous values
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/phase3/foundation -p 'test_f3_secret_triage_sanitized.py' -v
      - name: Scan local checkout, fully redact secrets and retain private raw report only transiently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_receipts/private_source_scan ci_receipts/foundation
          chmod 700 ci_receipts/private_source_scan
          # The repo checkout is the input. No real user data, Mac files,
          # production Secrets, API credentials, live provider or Engine.
          # A finding does not imply exploitation; security owner triages it.
          "$(go env GOPATH)/bin/gitleaks" dir \
            --redact=100 --no-banner --log-level=error \
            --exit-code 0 --report-format json \
            --report-path ci_receipts/private_source_scan/raw.json .
          python3 - <<'PY'
          import collections,json,os
          from pathlib import Path
          private=Path("ci_receipts/private_source_scan/raw.json")
          if not private.is_file():
              raise SystemExit("FULL_SECRET_SCANNER_DID_NOT_WRITE_REPORT")
          records=json.loads(private.read_text())
          if not isinstance(records,list):
              raise SystemExit("FULL_SECRET_SCANNER_INVALID_JSON")
          # NEVER upload raw potential secrets, matched excerpts, file content,
          # entropy, account data or raw locations. Only aggregate by rule.
          counts=collections.Counter(
              str(x.get("RuleID","UNKNOWN"))[:64] for x in records)
          safe={
              "schema":"foundation.f3.gitleaks_redacted_source_scan.v1",
              "git_sha":os.environ["GITHUB_SHA"],
              "scanner":"gitleaks v8.28.0 (source-pinned Go module)",
              "scope":"disposable-GitHub-Actions-checked-out-directory-not-git-history",
              "total_potential_findings":len(records),
              "rules":{"".join(c for c in k if c.isalnum() or c in "-_.")[:64]:v
                       for k,v in sorted(counts.items())},
              "raw_report_uploaded":False,
              "mac_target_touched":False,
              "production_secrets_read":False,
              "owner_security_triage_complete":False,
              "security_gate_accepted":False}
          out=Path("ci_receipts/foundation/gitleaks_sanitized_summary.json")
          out.write_text(json.dumps(safe,sort_keys=True,indent=2)+chr(10))
          print("F3_GITLEAKS_SCAN_EXECUTED_FINDINGS_"+str(len(records))+"_NOT_ACCEPTANCE")
          PY
          python3 scripts/phase3/summarize_f3_secret_findings.py \
            --raw ci_receipts/private_source_scan/raw.json \
            --output ci_receipts/foundation/gitleaks_safe_source_locations.json \
            --sha "$GITHUB_SHA"
          rm -rf ci_receipts/private_source_scan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-f3-redacted-gitleaks-counts-not-acceptance
          path: |
            ci_receipts/foundation/gitleaks_sanitized_summary.json
            ci_receipts/foundation/gitleaks_safe_source_locations.json
          retention-days: 14
          if-no-files-found: warn
