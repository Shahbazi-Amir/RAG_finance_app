name: API_F3 Product stream integrity isolated L1

on:
  push:
    branches: [agent/api-f3-stream-integrity-l1-20261123, agent/api-f3-send-peer-fence-20261123, agent/api-f3-claim-citation-graph-20261123, agent/api-f3-retrieval-unique-chunks-20261123, agent/api-f3-ledger-canonical-receipts-20261123]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream-contract-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact API dependency lock (no model)
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes --only-binary=:all: -r locks/requirements-api.lock
          python -m pip check
      - name: Compile source
        run: |
          python -m compileall -q src/phase3/rag_runtime src/phase3/auth apps/api tests/phase3/api tests/phase3/contracts
      - name: Test event integrity positive and negative
        run: |
          python -m unittest discover -s tests/phase3/api -p 'test_stream_event_integrity.py' -v
      - name: Test private Cache-Control no-store and pure-ASGI stream delivery
        run: |
          python -m unittest discover -s tests/phase3/api -p 'test_private_http_no_store.py' -v
      - name: Verify provisional Lifecycle intent DTO positive and negative
        run: |
          python -m unittest discover -s tests/phase3/contracts -p 'test_lifecycle_intent_shape.py' -v
      - name: Send private TLS peer boundary negative tests
        run: |
          python -m unittest discover -s tests/phase3/api -p 'test_send_peer_boundary.py' -v
      - name: Claim-Citation reciprocal graph positive and negative
        run: |
          python -m unittest discover -s tests/phase3/api -p 'test_claim_citation_graph.py' -v
      - name: C018 ranked chunk uniqueness, immutable C011 and ledger tamper tests
        run: |
          python -m unittest discover -s tests/phase3/api -p 'test_retrieved_sources_gate3.py' -v
      - name: Full API regressions
        run: |
          python -m unittest discover -s tests/phase3/api -p 'test_*.py' -v
      - name: Product and History contracts
        run: |
          python -m unittest discover -s tests/phase3/contracts -p 'test_*.py' -v
