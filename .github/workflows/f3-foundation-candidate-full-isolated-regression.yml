name: FOUNDATION F3 exact-branch full isolated app-only source images and PG17.11 regression

on:
  push:
    branches: [agent/ui-f3-foundation-latest-20261124]
  pull_request:
    branches: [integration/f3-foundation-history-two-users-20261124]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-code-and-real-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind one exact source tree and forbid unapproved SQL 011
        run: |
          set -euo pipefail
          echo "FOUR_PR_INTEGRATED_SHA=$(git rev-parse HEAD)"
          test -f apps/web/app/api/product-capabilities/route.ts
          test -f apps/api/app_only_asgi.py
          test -f tests/phase3/api/test_full_binding_fence.py
          test -f infra/postgres/dev_f3_isolated/scripts/11_export_sanitized_receipt.sh
          test -f infra/postgres/dev_f3_isolated/scripts/22_restore_catalog_parity_probe.sh
          test -f infra/postgres/dev_f3_isolated/scripts/23_m04_migration_full_cycle.sh
          test -f infra/postgres/dev_f3_isolated/scripts/24_m10_idempotency_concurrency_probe.sh
          test ! -f infra/postgres/migrations/011_product_answer_claims.up.sql
          echo F3_FOUR_PR_REQUIRED_SOURCES_PINNED_PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API smoke/contract pins, never engine lock
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r apps/api/requirements-ci.txt 'PyJWT[crypto]==2.15.1' 'uvicorn==0.48.0' 'playwright==1.64.1'
      - name: Web lock, typecheck, lint, 131+ existing tests and production build
        run: |
          set -euo pipefail
          npm ci --prefix apps/web --no-audit --no-fund
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run lint
          npm --prefix apps/web run test
          npm --prefix apps/web run build
      - name: API ASGI all isolated unit and original engine-enabled regression, not dispatch
        run: |
          set -euo pipefail
          python -m compileall -q apps/api src/phase3/auth src/phase3/rag_runtime
          python -m unittest discover -s tests/phase3/api -p 'test_*.py' -v
          python -m unittest discover -s tests/phase3/contracts -p 'test_*.py' -v
          python -m unittest discover -s tests/phase3/integration/ui -p 'test_l2_no_dispatch_receipt_gate.py' -v
      - name: Independently reject forged source SHA, SBOM, security or owner acceptance
        shell: bash
        run: |
          python -m unittest discover -s tests/phase3/foundation -p 'test_f3_exact_sha_artifacts.py' -v
      - name: All 393 canonical IDs exact source mapping and no false acceptance
        run: python -m unittest discover -s tests/phase3/integration -p 'test_integrated_393_registry.py' -v
      - name: Emit all 393 canonical owner/criterion/test-state rows, no Gate promotion
        run: |
          set -euo pipefail
          python -m py_compile scripts/phase3/build_f3_unified_register.py
          python scripts/phase3/build_f3_unified_register.py --sha "$GITHUB_SHA" --out ci_receipts/foundation
          python - <<'PY'
          import csv,json,os
          from pathlib import Path
          out=Path("ci_receipts/foundation")
          doc=json.loads((out/"f3_393_evidence_ledger.json").read_text())
          rows=list(csv.DictReader((out/"f3_393_evidence_ledger.csv").open()))
          assert len(doc["rows"])==len(rows)==393
          assert doc["generated_source_sha"]==os.environ["GITHUB_SHA"]
          assert sum(x["counts_as_activity"]=="true" for x in rows)==262
          assert len(set(x["id"] for x in rows))==393
          assert all(x["acceptance_status"]!="ACCEPTED" for x in rows)
          print("F3_UNIFIED_REGISTER_393_NO_AUTOMATIC_ACCEPTANCE_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-foundation-393-per-id-unaccepted-canonical-ledger
          path: |
            ci_receipts/foundation/f3_393_evidence_ledger.csv
            ci_receipts/foundation/f3_393_evidence_ledger.json
          retention-days: 14
          if-no-files-found: warn
      - name: Isolated app-only SHA namespace and Compose preflight (no image pull)
        env:
          CI: 'true'
          F3_PROJECT_NAME: f3-app-only-ci-${{ github.run_id }}-${{ github.run_attempt }}
          F3_RELEASE_TAG: ci
          F3_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/phase3/app_only_candidate_preflight.sh --inspect-unused
          if F3_PROJECT_NAME=rag_finance_f3_demo bash scripts/phase3/app_only_candidate_preflight.sh; then echo UNSAFE_PROJECT_ACCEPTED; exit 1; fi
          if F3_SOURCE_SHA=0000000000000000000000000000000000000000 bash scripts/phase3/app_only_candidate_preflight.sh; then echo SHA_DRIFT_ACCEPTED; exit 1; fi
          if F3_RELEASE_TAG=latest bash scripts/phase3/app_only_candidate_preflight.sh; then echo UNPINNED_TAG_ACCEPTED; exit 1; fi
          echo F3_APP_ONLY_READONLY_SOURCE_PREFLIGHT_POS_NEG_PASS
      - name: Original DB scripts static guard and protected-path negative only
        run: bash infra/postgres/dev_f3_isolated/tests/run_static.sh
      - name: Real isolated APP_ONLY Uvicorn listener, no Engine dependencies
        env:
          PHASE3_APP_MODE: APP_ONLY
        run: |
          set -euo pipefail
          python -m uvicorn apps.api.app_only_asgi:app --host 127.0.0.1 --port 8118 --no-access-log > "$RUNNER_TEMP/app-only-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8118/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 3 http://127.0.0.1:8118/health/live >/dev/null
          test "$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:8118/health/ready)" = 503
          test "$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"question":"unsafe"}' http://127.0.0.1:8118/v1/messages)" = 503
          test "$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' -H 'x-owner-user-id: forgedA' http://127.0.0.1:8118/v1/conversations)" = 503
          echo F3_APP_ONLY_REAL_ASGI_LIVE_READY503_SEND503_OWNER503_NO_ENGINE_PASS
      - name: Install pinned browser for synthetic History and real Next APP_ONLY
        run: python -m playwright install --with-deps chromium
      - name: Existing React desktop/mobile A-B 401/503 regression (synthetic intercepted History only)
        run: |
          set -euo pipefail
          (cd apps/web && ./node_modules/.bin/next start -H 127.0.0.1 -p 3000) > "$RUNNER_TEMP/next-fixture.log" 2>&1 &
          child=$!
          trap 'kill "$child" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/api/product-capabilities >/dev/null; then break; fi
            sleep 1
          done
          python tests/phase3/integration/ui/product_chat_browser.py
      - name: Real Next APP_ONLY run with disabled Send and 503 before API
        env:
          PHASE3_APP_MODE: APP_ONLY
        run: |
          set -euo pipefail
          (cd apps/web && ./node_modules/.bin/next start -H 127.0.0.1 -p 3100) > "$RUNNER_TEMP/next-app-only.log" 2>&1 &
          child=$!
          trap 'kill "$child" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:3100/api/product-capabilities >/dev/null; then break; fi
            sleep 1
          done
          python tests/phase3/integration/ui/app_only_real_browser.py
          echo F3_FOUR_PR_APP_ONLY_WEB_BFF_API_ISOLATED_L1_PASS

  build-api-app-only-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build real non-root API image with locked requirements and no Engine wheelhouse
        run: |
          set -euo pipefail
          docker build --pull=false --file infra/phase3_l1/Dockerfile.api --build-arg SOURCE_SHA="$(git rev-parse HEAD)" -t rag-f3-app-only-api:ci .
          docker image inspect rag-f3-app-only-api:ci --format '{{.Id}} {{.Config.User}} {{.Config.Healthcheck.Test}}'
      - name: Run actual no-network container, prove health and 503 without dispatch
        run: |
          set -euo pipefail
          docker run -d --name f3-app-only-api-test --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --pids-limit 64 --memory 256m rag-f3-app-only-api:ci
          trap 'docker rm -f f3-app-only-api-test || true' EXIT
          for n in $(seq 1 35); do
            if docker exec f3-app-only-api-test python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live',timeout=2)" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec f3-app-only-api-test python3 -c "import urllib.request; from urllib.error import HTTPError; u='http://127.0.0.1:8080'; assert urllib.request.urlopen(u+'/health/live').status==200; exec('try:\\n urllib.request.urlopen(u+\"/health/ready\")\\nexcept HTTPError as e:\\n assert e.code==503')"
          test "$(docker inspect -f '{{.State.Running}}' f3-app-only-api-test)" = true
          test "$(docker inspect -f '{{.Config.User}}' f3-app-only-api-test)" = "11001:11001"
          echo F3_DOCKER_APP_ONLY_API_REAL_NONROOT_LISTENER_PASS_NO_MOTOR

      - name: Build actual non-root app-only Web image with pinned Next, no Engine assets
        run: |
          set -euo pipefail
          docker build --pull=false --file infra/phase3_l1/Dockerfile.web --build-arg SOURCE_SHA="$(git rev-parse HEAD)" -t rag-f3-app-only-web:ci .
          docker image inspect rag-f3-app-only-web:ci --format '{{.Id}} {{.Config.User}} {{.Config.Healthcheck.Test}}'
          docker run --rm --network none rag-f3-app-only-web:ci node -e "const fs=require('fs'); if(fs.existsSync('/usr/local/lib/node_modules/npm')) process.exit(2); require('next/package.json'); require('react/package.json'); console.log('WEB_PROD_RUNTIME_NO_NPM_TOOLCHAIN_PASS')"
      - name: Isolated Web+API containers internal DNS, zero Send and unavailable signed History
        run: |
          set -euo pipefail
          docker network create --internal f3-app-only-private-ci
          trap 'docker rm -f f3-web-private-ci f3-api-private-ci 2>/dev/null || true; docker network rm f3-app-only-private-ci 2>/dev/null || true' EXIT
          docker run -d --name f3-api-private-ci --network f3-app-only-private-ci --network-alias app-only-api --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --pids-limit 64 --memory 256m rag-f3-app-only-api:ci
          docker run -d --name f3-web-private-ci --network f3-app-only-private-ci --read-only --tmpfs /tmp:rw,nosuid,size=32m,uid=11003,gid=11003 --tmpfs /srv/release/apps/web/.next/cache:rw,nosuid,size=64m,uid=11003,gid=11003 --pids-limit 128 --memory 512m rag-f3-app-only-web:ci
          for n in $(seq 1 60); do
            if docker exec f3-web-private-ci node -e "fetch('http://127.0.0.1:3000/api/product-capabilities').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec f3-web-private-ci node -e "fetch('http://app-only-api:8080/health/live').then(r=>r.json()).then(j=>process.exit(j.process_alive===true&&j.application_ready===false?0:1)).catch(()=>process.exit(1))"
          docker exec f3-web-private-ci node -e "fetch('http://127.0.0.1:3000/api/product-capabilities').then(r=>r.json()).then(j=>process.exit(j.send_mode==='DISABLED'&&j.engine_available===false?0:1)).catch(()=>process.exit(1))"
          docker exec f3-web-private-ci node -e "fetch('http://127.0.0.1:3000/api/history/messages',{method:'POST',headers:{'content-type':'application/json'},body:'{}'}).then(r=>r.json().then(j=>process.exit(r.status===503&&j.error==='ENGINE_NOT_AVAILABLE'?0:1))).catch(()=>process.exit(1))"
          docker exec f3-web-private-ci node -e "fetch('http://app-only-api:8080/health/ready').then(r=>process.exit(r.status===503?0:1)).catch(()=>process.exit(1))"
          echo F3_REAL_TWO_CONTAINERS_INTERNAL_DNS_WEB_BFF_SEND503_API_READY503_NO_ENGINE_PASS

      - name: Real Compose isolated Web API no public ports and source pins
        env:
          CI: 'true'
          F3_PROJECT_NAME: f3-app-only-ci-${{ github.run_id }}-${{ github.run_attempt }}
          F3_RELEASE_TAG: ci
          F3_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The preflight never pulls, starts, deletes or even inspects demo.
          bash scripts/phase3/app_only_candidate_preflight.sh --inspect-unused
          # Deliberately bad project / source must be denied without mutation.
          if F3_PROJECT_NAME=rag_finance_f3_demo bash scripts/phase3/app_only_candidate_preflight.sh; then exit 1; fi
          if F3_SOURCE_SHA=0000000000000000000000000000000000000000 bash scripts/phase3/app_only_candidate_preflight.sh; then exit 1; fi
          file=infra/phase3_l1/compose.app-only.internal.yml
          docker compose -f "$file" config -q
          docker compose -f "$file" config --format json | python3 -c 'import json,sys; x=json.load(sys.stdin); assert set(x["services"])=={"api","web"}; assert all("ports" not in v for v in x["services"].values()); assert x["networks"]["private"]["internal"] is True; assert x["services"]["api"]["read_only"] is True; assert x["services"]["web"]["read_only"] is True; print("F3_COMPOSE_NO_PUBLIC_PORTS_READ_ONLY_INTERNAL_PASS")'
          trap 'docker compose -f "$file" down --remove-orphans 2>/dev/null || true' EXIT
          docker compose -f "$file" up -d --no-build --pull never
          web_id="$(docker compose -f "$file" ps -q web)"
          test -n "$web_id"
          test -z "$(docker port "$web_id" 2>/dev/null)"
          docker compose -f "$file" exec -T web node -e "fetch('http://app-only-api:8080/health/live').then(r=>r.json()).then(j=>process.exit(j.process_alive&&!j.application_ready?0:1)).catch(()=>process.exit(1))"
          docker compose -f "$file" exec -T web node -e "fetch('http://127.0.0.1:3000/api/product-capabilities').then(r=>r.json()).then(j=>process.exit(j.send_mode==='DISABLED'&&!j.generation_available?0:1)).catch(()=>process.exit(1))"
          echo F3_APP_ONLY_REAL_COMPOSE_PRIVATE_WEB_API_NO_ENGINE_PASS
      - name: Independent clean Compose cold-restart no-public-port smoke and timing
        env:
          CI: 'true'
          F3_PROJECT_NAME: f3-app-only-ci-${{ github.run_id }}-${{ github.run_attempt }}
          F3_RELEASE_TAG: ci
          F3_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          file=infra/phase3_l1/compose.app-only.internal.yml
          # Previous step cleaned its own containers. This starts the same
          # immutable source image without inheriting a running service.
          test -z "$(docker compose -f "$file" ps -q)"
          start="$(date +%s)"
          trap 'docker compose -f "$file" down --remove-orphans >/dev/null 2>&1 || true' EXIT
          docker compose -f "$file" up -d --no-build --pull never
          for n in $(seq 1 75); do
            if docker compose -f "$file" exec -T web node -e "fetch('http://127.0.0.1:3000/api/product-capabilities').then(r=>r.json()).then(x=>process.exit(x.send_mode==='DISABLED'&&!x.engine_available?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker compose -f "$file" exec -T web node -e "fetch('http://app-only-api:8080/health/live').then(r=>r.json()).then(x=>process.exit(x.process_alive&&!x.application_ready?0:1)).catch(()=>process.exit(1))"
          docker compose -f "$file" exec -T web node -e "fetch('http://127.0.0.1:3000/api/history/messages',{method:'POST',headers:{'content-type':'application/json'},body:'{}'}).then(r=>process.exit(r.status===503?0:1)).catch(()=>process.exit(1))"
          for kind in api web; do
            cid="$(docker compose -f "$file" ps -q "$kind")"
            test -n "$cid"
            test -z "$(docker port "$cid" 2>/dev/null)"
            test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = true
          done
          elapsed="$(($(date +%s)-start))"
          mkdir -p ci_receipts/foundation
          python3 - "$elapsed" <<'PY'
          import json,os,sys
          from pathlib import Path
          doc={
            "schema":"foundation.f3.clean_compose_restart_lab.v1",
            "git_sha":os.environ["GITHUB_SHA"],
            "elapsed_wall_clock_seconds":int(sys.argv[1]),
            "clean_app_only_compose_start":True,
            "no_public_ports":True,
            "read_only_images":True,
            "send_503":True,
            "engine_started":False,
            "stateful_restore_or_rollback":False,
            "mac_target_tested":False,
            "approved_rto_threshold":None}
          Path("ci_receipts/foundation/app_only_clean_restart.json").write_text(
             json.dumps(doc,sort_keys=True,indent=2)+chr(10))
          print("F3_APP_ONLY_CLEAN_COMPOSE_COLD_RESTART_PASS_NO_TARGET_ROLLBACK")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-foundation-app-only-clean-cold-restart
          path: ci_receipts/foundation/app_only_clean_restart.json
          retention-days: 14
          if-no-files-found: warn
      - name: Emit exact-source LOCAL OCI image identity and hardening receipt
        if: success()
        run: |
          set -euo pipefail
          mkdir -p ci_receipts/foundation
          python3 - <<'PY'
          import json,os,subprocess
          sha=os.environ["GITHUB_SHA"]
          result={"schema":"foundation.f3.local_oci_image_identity.v1",
                  "git_sha":sha,"scope":"CI_ONLY_LOCAL_IMAGE_IDS_NOT_REGISTRY_MANIFEST_DIGEST",
                  "mac_target":"NOT_RUN","approved_sbom":"NOT_RUN",
                  "vulnerability_scan":"NOT_RUN","released":"NO",
                  "images":{}}
          for service,uid in (("api","11001:11001"),("web","11003:11003")):
              image="rag-f3-app-only-"+service+":ci"
              doc=json.loads(subprocess.check_output(
                  ["docker","image","inspect",image],text=True))[0]
              cfg=doc["Config"]
              assert doc["Id"].startswith("sha256:") and len(doc["Id"])==71
              assert doc["Os"]=="linux" and doc["Architecture"]=="amd64"
              assert cfg["Labels"].get("org.opencontainers.image.revision")==sha
              assert cfg["User"]==uid
              assert cfg.get("Healthcheck",{}).get("Test")
              result["images"][service]={
                  "local_image_id":doc["Id"],"source_revision":sha,
                  "os_arch":"linux/amd64","uid_gid":uid,
                  "has_healthcheck":True,"registry_manifest_digest":None}
          with open("ci_receipts/foundation/local_image_identity.json","w") as out:
              json.dump(result,out,indent=2,sort_keys=True)
              out.write(chr(10))
          print("F3_FOUNDATION_LOCAL_IMAGE_IDS_SHA_NONROOT_HEALTH_PASS_NOT_RELEASE_DIGEST")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-foundation-local-oci-identity-not-release
          path: ci_receipts/foundation/local_image_identity.json
          retention-days: 14
          if-no-files-found: warn

      - name: Emit immutable SOURCE+local OCI image provenance and exact PG migration hashes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/phase3/write_f3_app_only_provenance.py
          python3 scripts/phase3/write_f3_app_only_provenance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-foundation-local-image-source-provenance-not-release
          path: ci_receipts/foundation/app_only_local_source_provenance.json
          retention-days: 14
          if-no-files-found: warn


      - name: Prepare bounded same-binary audit output directory
        run: mkdir -p ci_receipts/foundation/same_binary
      - name: Actual tested API image SPDX SBOM in this same isolated Docker job
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a
        with:
          image: rag-f3-app-only-api:ci
          format: spdx-json
          syft-version: v1.38.0
          output-file: ci_receipts/foundation/same_binary/api.spdx.json
          upload-artifact: 'false'
          upload-release-assets: 'false'
          dependency-snapshot: 'false'
      - name: Actual tested Web image SPDX SBOM in this same isolated Docker job
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a
        with:
          image: rag-f3-app-only-web:ci
          format: spdx-json
          syft-version: v1.38.0
          output-file: ci_receipts/foundation/same_binary/web.spdx.json
          upload-artifact: 'false'
          upload-release-assets: 'false'
          dependency-snapshot: 'false'
      - name: Grype scan exact API image SPDX after test (no auto security approval)
        uses: anchore/scan-action@16910ac423301c6d30554b83a7f71ac6ff4a51f3
        with:
          sbom: ci_receipts/foundation/same_binary/api.spdx.json
          grype-version: v0.110.0
          output-format: json
          output-file: ci_receipts/foundation/same_binary/api-grype.json
          fail-build: 'false'
          cache-db: 'false'
      - name: Grype scan exact Web image SPDX after test (no auto security approval)
        uses: anchore/scan-action@16910ac423301c6d30554b83a7f71ac6ff4a51f3
        with:
          sbom: ci_receipts/foundation/same_binary/web.spdx.json
          grype-version: v0.110.0
          output-format: json
          output-file: ci_receipts/foundation/same_binary/web-grype.json
          fail-build: 'false'
          cache-db: 'false'
      - name: Match tested OCI ID to scanned SBOMs and retain non-sensitive severity aggregates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          base=Path("ci_receipts/foundation/same_binary")
          saved=json.loads(Path("ci_receipts/foundation/app_only_local_source_provenance.json").read_text())
          exact_sha=os.environ["GITHUB_SHA"]
          assert saved["git_sha"]==exact_sha
          report={
            "schema":"foundation.f3.same_ci_tested_local_image_security.v1",
            "git_sha":exact_sha,"runner":os.environ["GITHUB_RUN_ID"],
            "same_ci_job_image_tested_and_scanned":True,
            "readiness_verified_on_target":False,
            "registry_manifest_digest_verified":False,
            "scan_result_is_release_approval":False,
            "source_secret_findings_triaged":False,
            "approved_security_policy":False,
            "gate_result":"HOLD_NOT_ACCEPTED",
            "images":{}
          }
          for kind in ("api","web"):
            image=json.loads(subprocess.check_output(
              ["docker","image","inspect","rag-f3-app-only-"+kind+":ci"],text=True))[0]
            local_id=image["Id"]
            assert local_id==saved["local_images"][kind]["local_content_image_id"],"IMAGE_ID_DIFFERENT_FROM_TESTED_PROVENANCE_"+kind
            assert image["Config"]["Labels"]["org.opencontainers.image.revision"]==exact_sha
            source=base/(kind+".spdx.json")
            sbom=json.loads(source.read_text())
            assert sbom["spdxVersion"]=="SPDX-2.3" and len(sbom["packages"])>0
            scan=json.loads((base/(kind+"-grype.json")).read_text())
            matches=scan.get("matches")
            assert isinstance(matches,list),"SCAN_INCOMPLETE_"+kind
            by_severity={}
            for match in matches:
              severity=str(match["vulnerability"].get("severity","UNKNOWN")).upper()
              by_severity[severity]=by_severity.get(severity,0)+1
            report["images"][kind]={
              "tested_and_scanned_same_local_image_id":local_id,
              "spdx_sha256":hashlib.sha256(source.read_bytes()).hexdigest(),
              "sbom_packages":len(sbom["packages"]),
              "grype_findings":len(matches),
              "by_severity":by_severity,
              "registry_digest":None,
              "critical_high_zero_assertion":False,
            }
          target=Path("ci_receipts/foundation/f3_same_tested_binary_scan_receipt.json")
          target.write_text(json.dumps(report,sort_keys=True,indent=2)+chr(10))
          print("F3_SAME_CI_TESTED_LOCAL_BINARY_SBOM_GRYPE_ID_EQUAL_PASS_RELEASE_HOLD")
          PY
          # Do not upload raw Grype matches, paths or potentially sensitive data.
          rm -f ci_receipts/foundation/same_binary/api-grype.json ci_receipts/foundation/same_binary/web-grype.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-foundation-tested-binary-local-sbom-grype-hold
          path: |
            ci_receipts/foundation/same_binary/api.spdx.json
            ci_receipts/foundation/same_binary/web.spdx.json
            ci_receipts/foundation/f3_same_tested_binary_scan_receipt.json
          retention-days: 14
          if-no-files-found: warn


  signed-app-only-api-image-lab:
    name: Immutable signed-History mTLS-only candidate image, fail-closed without Ops secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated REAL signed mTLS History entrypoint without mounting secrets or Engine
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -f infra/postgres/migrations/011_product_answer_claims.up.sql
          docker build --pull=false --file infra/phase3_l1/Dockerfile.api.signed_history \
             --build-arg SOURCE_SHA="$GITHUB_SHA" -t rag-f3-signed-app-only-api:ci .
          python3 - <<'PY'
          import json,os,subprocess
          x=json.loads(subprocess.check_output(
            ["docker","image","inspect","rag-f3-signed-app-only-api:ci"],text=True))[0]
          c=x["Config"]
          assert c["Labels"]["org.opencontainers.image.revision"]==os.environ["GITHUB_SHA"]
          assert c["User"]=="11001:11001"
          assert c["Cmd"]==["python3","-m","apps.api.private_app_only_asgi",
                             "--config","/run/secrets/phase3-app-only.json"]
          assert c.get("Healthcheck",{}).get("Test")
          assert x["Os"]=="linux" and x["Architecture"]=="amd64"
          print("F3_SIGNED_APP_ONLY_RUNTIME_REAL_IMAGE_NONROOT_PINNED_CMD_PASS")
          PY
          docker run --rm --network none --read-only --user 11001:11001 \
            --entrypoint python3 rag-f3-signed-app-only-api:ci \
            -c "import apps.api.private_app_only_asgi; from pathlib import Path; assert not Path('/srv/release/tests').exists(); print('REAL_SIGNED_IMPORT_NO_TEST_ASSETS_PASS')"
      - name: Prove signed API cannot start with absent protected Ops config
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm --network none --read-only --user 11001:11001 \
            --pids-limit 64 --memory 256m \
            rag-f3-signed-app-only-api:ci > "$RUNNER_TEMP/f3-signed-refusal-private.txt" 2>&1
          code=$?
          set -e
          test "$code" -eq 78
          grep -Fxq "APP_ONLY_STARTUP_DENIED" "$RUNNER_TEMP/f3-signed-refusal-private.txt"
          rm -f "$RUNNER_TEMP/f3-signed-refusal-private.txt"
          mkdir -p ci_receipts/foundation/signed_runtime
          echo F3_SIGNED_API_NO_SECRETS_NO_CONFIG_FAIL_CLOSED_EXIT78_PASS
      - name: SPDX SBOM signed-real-runtime, same tested OCI image
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a
        with:
          image: rag-f3-signed-app-only-api:ci
          format: spdx-json
          syft-version: v1.38.0
          output-file: ci_receipts/foundation/signed_runtime/signed-api.spdx.json
          upload-artifact: 'false'
          upload-release-assets: 'false'
          dependency-snapshot: 'false'
      - name: Grype scan signed-real-runtime SBOM, findings never auto-release
        uses: anchore/scan-action@16910ac423301c6d30554b83a7f71ac6ff4a51f3
        with:
          sbom: ci_receipts/foundation/signed_runtime/signed-api.spdx.json
          grype-version: v0.110.0
          output-format: json
          output-file: ci_receipts/foundation/signed_runtime/private-signed-grype.json
          fail-build: 'false'
          cache-db: 'false'
      - name: Sanitized same-SHA signed image identity and vulnerability counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path("ci_receipts/foundation/signed_runtime")
          scan=json.loads((root/"private-signed-grype.json").read_text())
          assert isinstance(scan.get("matches"),list)
          spdx=root/"signed-api.spdx.json"
          doc=json.loads(spdx.read_text())
          assert doc["spdxVersion"]=="SPDX-2.3" and doc.get("packages")
          img=json.loads(subprocess.check_output(
            ["docker","image","inspect","rag-f3-signed-app-only-api:ci"],text=True))[0]
          bysev={}
          for match in scan["matches"]:
              sev=str(match["vulnerability"].get("severity","UNKNOWN")).upper()
              bysev[sev]=bysev.get(sev,0)+1
          receipt={
             "schema":"foundation.f3.signed_real_runtime_local_oci_scan.v1",
             "git_sha":os.environ["GITHUB_SHA"],
             "same_job_tested_and_scanned_image_id":img["Id"],
             "spdx_sha256":hashlib.sha256(spdx.read_bytes()).hexdigest(),
             "spdx_packages":len(doc["packages"]),
             "grype_matches":len(scan["matches"]),"by_severity":bysev,
             "no_config_exit_code":78,"no_engine_started":True,
             "no_runtime_test_assets":True,"no_production_credentials":True,
             "registry_manifest_digest":None,"mac_target_tested":False,
             "ready_with_real_idp_and_pg":False,"owner_security_approved":False,
             "release":"HOLD"}
          (root/"signed-api-receipt.json").write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+chr(10))
          print("F3_SIGNED_HISTORY_RUNTIME_LOCAL_IMAGE_TEST_SCAN_PASS_SECURITY_HOLD")
          PY
          rm -f ci_receipts/foundation/signed_runtime/private-signed-grype.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-signed-app-only-real-runtime-local-sbom-hold
          path: |
            ci_receipts/foundation/signed_runtime/signed-api.spdx.json
            ci_receipts/foundation/signed_runtime/signed-api-receipt.json
          retention-days: 14
          if-no-files-found: warn


  integrated-isolated-pg17:
    name: Integrated PG17.11 pinned 001-010, TLS RLS DB55 backup restore
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source with all immutable refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin check and static tests
        shell: bash
        run: |
          set -euo pipefail
          cd infra/postgres/dev_f3_isolated
          bash tests/run_static.sh
          for ref in \
            d93dcf7cbf9290acd4cd3aa0164ef05689049da4 \
            656604356dadea953031fcdb74650a5d42df4e9b \
            1678e87b7984094b74ec995383b8d4383e5f5ae7 \
            bfd6b1d9ed23e5f4cc6f126b579f90d7c877a7a6; do
            git cat-file -e "${ref}^{commit}"
          done
      - name: Fresh 001-010 TLS DB55 role ACL and independent restore
        shell: bash
        run: |
          set -euo pipefail
          cd infra/postgres/dev_f3_isolated
          export SOURCE_REPO="$GITHUB_WORKSPACE"
          export LAB_ROOT="$RUNNER_TEMP/f3-INTEGRATED-app-only-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
