  evidence-42-slices-on-success:
    name: Source-test mapped 42 additional bounded IDs, 393 unique, no owner acceptance
    needs:
      - integrated-code-and-real-loopback
      - build-api-app-only-container
      - integrated-isolated-pg17
      - signed-app-only-api-image-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: f3-foundation-393-per-id-unaccepted-canonical-ledger
          path: ci_receipts/previous_canonical_ledger
      - name: Reject malformed or fabricated bounded witness source mappings
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/phase3/foundation -p 'test_f3_42_witness_guards.py' -v
      - name: Verify 42 new distinct source-tested bounded slices after 4 successful same-SHA jobs
        env:
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase3/emit_f3_42_source_ci_witnesses.py \
             --ledger ci_receipts/previous_canonical_ledger/f3_393_evidence_ledger.json \
             --out ci_receipts/foundation/source_attested_62
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path("ci_receipts/foundation/source_attested_62")
          a=json.loads((path/"f3_393_62_ci_lab_rows_unaccepted.json").read_text())
          b=json.loads((path/"f3_42_additional_ci_lab_witnesses.json").read_text())
          assert len(a["rows"])==393
          assert b["git_sha"]==os.environ["GITHUB_SHA"]
          assert a["counts"]["all_bounded_ci_rows"]==62
          assert b["additional_source_tested_on_this_sha"]==42
          assert all(x["acceptance_status"]=="NOT_ACCEPTED_NO_INDEPENDENT_SIGNED_RECEIPT"
                     for x in a["rows"])
          print("F3_62_OF_262_CI_BOUNDED_EVIDENCE_NO_OWNER_ACCEPTANCE_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f3-source-attested-62-of-262-bounded-ci-only-no-acceptance
          path: ci_receipts/foundation/source_attested_62/*
          retention-days: 14
          if-no-files-found: error
