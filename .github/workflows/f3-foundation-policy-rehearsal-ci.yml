name: Foundation F3 offline policy rehearsal and scope guard (no approval)
on:
  push:
    branches: [integration/f3-foundation-send-fence-restore-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Execute independent proposal-only incident and backup simulation tests
        run: python3 -m unittest discover -s tests/phase3/foundation -p 'test_f3_policy_rehearsal.py' -v
      - name: Check exact API137 transfer and all protected runtime trees
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          base="f2b743a1588cac76fddafc36e3b489deb59d42ac"
          sha=os.environ["GITHUB_SHA"]
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==sha
          subprocess.check_call(["git","merge-base","--is-ancestor",base,sha])
          changed=subprocess.check_output(["git","diff","--name-only","-z",base,sha]).decode().split("\0")
          paths=[p for p in changed if p]
          transfer=json.loads(Path("coordination/integration/F3_WAVE7_API137_TRANSFER.json").read_text())
          assert transfer["base_sha"]==base and transfer["source_sha"]=="20567ad525933f7168e8ea04b8599bd450c297bb" and transfer["accepted"] is False
          allowed={r["path"] for r in transfer["rows"]}|{"coordination/integration/F3_WAVE7_API137_TRANSFER.json"}
          assert paths and all(p in allowed or p.startswith((".github/workflows/","tests/phase3/","scripts/phase3/","docs/operations/")) for p in paths)
          for row in transfer["rows"]:
              assert subprocess.check_output(["git","hash-object",row["path"]],text=True).strip()==row["selected_blob"],row["path"]
          runtime=subprocess.check_output(["git","diff","--name-only",base,sha,"--","apps/api"],text=True).splitlines()
          assert set(runtime)=={"apps/api/private_app_only_asgi.py","apps/api/private_history_contract.py"}
          for p in ("apps/web","src/phase3","packages/contracts","infra","locks","references/phase2"):
              assert subprocess.check_output(["git","rev-parse",base+":"+p])==subprocess.check_output(["git","rev-parse",sha+":"+p]),p
          assert not Path("infra/postgres/migrations/011_product_answer_claims.up.sql").exists()
          out=Path("ci_receipts/f3_wave6_policy_scope.json");out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps({"source_sha":sha,"base_sha":base,"run_id":os.environ["GITHUB_RUN_ID"],
              "scope":"EXACT_API137_TRANSFER_PLUS_CI_TEST_AND_PROPOSAL","changed_paths":paths,"runtime_trees_unchanged":False,"protected_trees_unchanged":True,"exact_api137_blobs":True,
              "proposal_unit_tests_passed":17,"phase4_implemented":False,"sql011":False,
              "target_verified":False,"retention_policy_approved":False,"accepted":False,"release":"HOLD"},indent=2)+"\n")
          print("F3_WAVE6_SCOPE_AND_POLICY_PROPOSAL_PASS_NO_APPROVAL")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f3-wave6-policy-scope
          path: ci_receipts/f3_wave6_policy_scope.json
          if-no-files-found: error
