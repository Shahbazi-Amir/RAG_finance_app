name: Foundation F3 separate disposable Keycloak security rehearsal (no approved policy)
on:
  push:
    branches: [integration/f3-foundation-send-fence-restore-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-keycloak:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage exact existing reviewed CI Keycloak harness
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Shahbazi-Amir/RAG_finance_app"
          test "$GITHUB_REF" = "refs/heads/integration/f3-foundation-send-fence-restore-20261124"
          sha=1998b31c86155a972b11ea745d6bb37e09549392
          git fetch --no-tags --depth=1 https://github.com/Shahbazi-Amir/RAG_finance_app.git "$sha"
          test "$(git rev-parse FETCH_HEAD)" = "$sha"
          for path in src/phase3/auth/initial_oidc_login.py tests/phase3/integration/api/initial_oidc_harness.py; do
            git show "$sha:$path" > "$path"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install same pinned isolated CI adapters
        run: |
          python -m pip install --no-cache-dir --index-url https://pypi.org/simple -r apps/api/requirements-ci.txt 'PyJWT[crypto]==2.15.1' 'uvicorn==0.48.0'
      - name: Actual disposable Keycloak hash metadata, temporary lockout, isolated B and audit
        run: python -u tests/phase3/integration/foundation/f3_disposable_idp_security.py
      - uses: actions/upload-artifact@v4
        with:
          name: f3-disposable-idp-security
          path: ci_receipts/f3_disposable_idp_security.json
          if-no-files-found: error

  phase4-design-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact locked API validation libraries
        run: |
          test "$GITHUB_REPOSITORY" = "Shahbazi-Amir/RAG_finance_app"
          test "$GITHUB_REF" = "refs/heads/integration/f3-foundation-send-fence-restore-20261124"
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r locks/requirements-api.lock
      - name: Proposed extension version and negative boundary tests
        run: python tests/phase3/foundation/test_f3_phase4_contract_draft.py
      - uses: actions/upload-artifact@v4
        with:
          name: f3-phase4-extension-contract-draft-only
          path: ci_receipts/f3_phase4_extension_contract_draft.json
          if-no-files-found: error
