name: F3 DB owner transaction scope and forged-GUC boundary
on:
  push:
    branches: [agent/db-f3-ab-history-restore-20261124]
    paths:
      - 'infra/postgres/dev_f3_isolated/scripts/27_history_actor_transaction_pool_fence.sh'
      - '.github/workflows/f3-db-owner-tx-fence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-tx-fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Static and source integrity guard
        shell: bash
        run: |
          set -euo pipefail
          echo "F3_ACTOR_TX_SHA=$(git rev-parse HEAD)"
          bash -n infra/postgres/dev_f3_isolated/scripts/27_history_actor_transaction_pool_fence.sh
          bash infra/postgres/dev_f3_isolated/tests/run_static.sh
          test ! -f infra/postgres/migrations/011_product_answer_claims.up.sql
      - name: Real TLS history_app owner A/B transactional connection reuse and explicit spoof risk
        shell: bash
        run: |
          set -euo pipefail
          cd infra/postgres/dev_f3_isolated
          export SOURCE_REPO="$GITHUB_WORKSPACE"
          export LAB_ROOT="$RUNNER_TEMP/f3-db-tx-owner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/00_prepare_source.sh
          bash scripts/01_create_isolated_lab.sh
          bash scripts/02_provision_roles.sh
          bash scripts/03_apply_pinned_001_010.sh
          bash scripts/04_bridge_and_db55.sh
          bash scripts/05_test_roles_tls_rls.sh
          bash scripts/27_history_actor_transaction_pool_fence.sh
      - name: Verify negative spoof and persistent session SET leakage are NOT accepted
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('ci_receipts/actor_tx_pool_receipt.json').read_text())
          assert r['contract_version']=='f3.db.history_transaction_actor_scope.v1'
          assert r['database_login']=='history_app_via_scram_tls_verify_full'
          assert r['same_connection_a_then_unset_then_b_then_unset']=='PASS_1_0_1_0'
          assert r['separate_connection_with_unset_owner']=='ZERO_ROWS'
          assert r['underlying_direct_sql_guc_is_spoofable'] is True
          assert r['owner_guc_spoof_is_a_security_pass'] is False
          assert r['persistent_set_cross_transaction_leak_reproduced'] is True
          assert r['reset_clears_persistent_owner_for_next_transaction'] is True
          assert r['api_connection_checkout_clearance']=='NOT_PROVEN'
          assert r['signed_actor_binding']=='NOT_PROVEN_BLOCKS_LIVE_HISTORY'
          assert (r['send_receipts'],r['execution_attempts'],r['answers'])==(0,0,0)
          assert r['phase3_011']=='NOT_RUN' and r['gate']=='NOT_ACCEPTED'
          print('ACTOR_TX_SCOPE_AND_EXPLICIT_SECURITY_GAP_RECEIPT=PASS')
          PY
      - name: Upload sanitized receipt only
        uses: actions/upload-artifact@v4
        with:
          name: f3-db-actor-tx-owner-guc-threat
          path: ci_receipts/actor_tx_pool_receipt.json
          if-no-files-found: error
          retention-days: 14
