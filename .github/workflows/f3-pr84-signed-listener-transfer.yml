name: Foundation PR84 signed listener transfer
on:
  push:
    branches: [integration/f3-pr84-foundation-signed-history-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-listener-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install exact API dependencies only
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r locks/requirements-api.lock
          python -m pip check
      - name: Source and transport regression (DB check mocked, not joint journey)
        run: |
          python -m compileall -q apps/api src/phase3
          python -m unittest discover -s tests/phase3/api -p 'test_app_only_no_engine.py' -v
          python -m unittest discover -s tests/phase3/api -p 'test_staging_private_asgi.py' -v
          python -m unittest discover -s tests/phase3/integration/api -p 'test_app_only_mtls_network.py' -v
      - name: Build opt-in signed API image and verify unconfigured denial
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f infra/phase3_l1/Dockerfile.api.signed --build-arg BASE=docker.io/library/python:3.13.5 --build-arg "SOURCE_SHA=$GITHUB_SHA" -t "f3-signed:$GITHUB_SHA" .
          test "$(docker image inspect -f '{{.Config.User}}' "f3-signed:$GITHUB_SHA")" = "11001:11001"
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "f3-signed:$GITHUB_SHA")" = "$GITHUB_SHA"
          set +e
          docker run --rm --network none "f3-signed:$GITHUB_SHA" > /tmp/f3-signed.stdout 2> /tmp/f3-signed.stderr
          rc=$?
          set -e
          test "$rc" = 78
          grep -Fx APP_ONLY_STARTUP_DENIED /tmp/f3-signed.stderr
          echo "SIGNED_IMAGE_LOCAL_ID=$(docker image inspect -f '{{.Id}}' "f3-signed:$GITHUB_SHA")"
      - name: Evidence scope
        if: always()
        run: |
          echo "SOURCE_SHA=$GITHUB_SHA"
          echo 'Transport regression only; Browser/OIDC/SQL/Restore joint journey NOT RUN by this job.'
