# Temporary management listener. Publish only as 127.0.0.1:<port>:8443.
worker_processes 1;
error_log /dev/null crit;
pid /tmp/nginx.pid;

events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;

    server {
        listen 8443 ssl default_server;
        server_name idp-staging.ragfinance.ir;
        ssl_certificate /run/ingress/tls/server.crt;
        ssl_certificate_key /run/ingress/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        if ($host != idp-staging.ragfinance.ir) { return 421; }

        proxy_set_header Host idp-staging.ragfinance.ir;
        proxy_set_header X-Forwarded-Host idp-staging.ragfinance.ir;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Client-Cert "";
        proxy_set_header X-Auth-Staging-Proxy-Proof "";
        proxy_request_buffering off;
        proxy_buffering off;

        location /admin/ { proxy_pass http://idp-keycloak:8080; }
        location /realms/ { proxy_pass http://idp-keycloak:8080; }
        location /resources/ { proxy_pass http://idp-keycloak:8080; }
        location / { return 404; }
    }
}
