server {
    listen 80;
    server_name idp-staging.ragfinance.ir;
    if ($host != idp-staging.ragfinance.ir) { return 421; }
    return 301 https://idp-staging.ragfinance.ir$request_uri;
}

server {
    listen 443 ssl;
    server_name idp-staging.ragfinance.ir;
    if ($host != idp-staging.ragfinance.ir) { return 421; }
    ssl_certificate /etc/nginx/tls/ragfinance/idp-staging/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/ragfinance/idp-staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 32k;

    location ~ ^/(realms/finance-staging/|resources/) {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host idp-staging.ragfinance.ir;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host idp-staging.ragfinance.ir;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Client-Cert "";
        proxy_set_header X-Auth-Staging-Proxy-Proof "";
    }
    location / { return 404; }
}
