server {
    listen 80;
    server_name ragfinance.ir;
    if ($host != ragfinance.ir) { return 421; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/rag-arvan-acme;
    }
    location / { return 301 https://ragfinance.ir$request_uri; }
}

server {
    listen 443 ssl;
    server_name ragfinance.ir;
    if ($host != ragfinance.ir) { return 421; }
    ssl_certificate /etc/letsencrypt/live/ragfinance.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ragfinance.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 16k;

    location ^~ /internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host ragfinance.ir;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host ragfinance.ir;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Client-Cert "";
        proxy_set_header X-Auth-CI-Proxy-Proof "";
        include /etc/nginx/rag-arvan-proxy-proof.inc;
    }
}
