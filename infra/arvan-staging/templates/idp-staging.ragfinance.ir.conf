server {
    listen 80;
    server_name idp-staging.ragfinance.ir;
    if ($host != idp-staging.ragfinance.ir) { return 421; }
    return 404;
}

server {
    listen 443 ssl;
    server_name idp-staging.ragfinance.ir;
    if ($host != idp-staging.ragfinance.ir) { return 421; }
    ssl_certificate /etc/nginx/tls/ragfinance/idp-staging/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/ragfinance/idp-staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 32k;

    return 404;
}
